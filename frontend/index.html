<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon.svg"
    />

    <!-- Responsive -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- SEO -->
    <title>Isuru Sampath | Full-Stack Developer</title>

    <meta
      name="description"
      content="Portfolio of Isuru Sampath, a Computer Science undergraduate and Full-Stack Developer specializing in React, Node.js, Express.js, MongoDB and modern web applications."
    />

    <meta
      name="keywords"
      content="Isuru Sampath, Full Stack Developer, MERN Stack, React Developer, Node.js, Express.js, MongoDB, Portfolio, Sri Lanka, Software Engineer"
    />

    <meta
      name="author"
      content="Isuru Sampath"
    />

    <meta
      name="robots"
      content="index, follow"
    />

    <meta
      name="theme-color"
      content="#020617"
    />

    <!-- Open Graph (Facebook / LinkedIn) -->
    <meta
      property="og:title"
      content="Isuru Sampath | Full-Stack Developer"
    />

    <meta
      property="og:description"
      content="Explore my software projects, technical skills, education and development experience."
    />

    <meta
      property="og:type"
      content="website"
    />

    <!-- Replace after deployment -->
    <meta
      property="og:url"
      content="https://your-domain.com"
    />

    <!-- Replace after uploading a preview image -->
    <meta
      property="og:image"
      content="https://your-domain.com/preview.png"
    />

    <!-- Twitter -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="Isuru Sampath | Full-Stack Developer"
    />

    <meta
      name="twitter:description"
      content="Explore my portfolio, projects, skills and software engineering experience."
    />

    <!-- Replace after uploading a preview image -->
    <meta
      name="twitter:image"
      content="https://your-domain.com/preview.png"
    />
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
